services:
  postgres:
    image: postgres:16-alpine
    container_name: gabriel-postgres
    environment:
      POSTGRES_DB: gabriel
      POSTGRES_USER: gabriel
      POSTGRES_PASSWORD: gabriel
    ports:
      - "5432:5432"
    volumes:
      - gabriel-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gabriel -d gabriel"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  gabriel-postgres-data:
