spring:
  application:
    name: backend
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/gabriel}
    username: ${SPRING_DATASOURCE_USERNAME:gabriel}
    password: ${SPRING_DATASOURCE_PASSWORD:gabriel}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  jackson:
    property-naming-strategy: SNAKE_CASE

server:
  port: ${PORT:8080}

# Gabriel's AI microservice (owned by teammate Gabriel). See /docs/api-contract.md section 6.
# mock-enabled=true (default) serves a hardcoded response matching the contract, so the
# backend runs fully standalone with zero dependency on the AI service being up.
# Flip to false (and point base-url at the real service) with no code changes.
ai-service:
  base-url: ${AI_SERVICE_URL:http://localhost:8000}
  mock-enabled: ${AI_SERVICE_MOCK:true}

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
